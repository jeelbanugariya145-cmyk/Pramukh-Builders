<!doctype html>
<html lang="gu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#EE751C">
  <title>Pramukh View</title>
  <link rel="icon" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=Noto+Sans+Gujarati:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="login" class="login" hidden></div>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <img class="brand-logo" src="assets/logo-pramukh-view.jpg" alt="Pramukh View">
        <button id="lang-toggle" class="btn btn-small lang-toggle"></button>
      </div>
      <div class="who-row">
        <div id="who" class="who"></div>
        <button id="logout" class="btn btn-small"></button>
      </div>
      <nav id="nav" class="nav"></nav>
      <div class="developers">
        <div id="developers-label" class="developers-label"></div>
        <div class="group-logos">
          <img src="assets/logo-pramukh-builders.jpg" alt="Pramukh Builders">
          <span class="divider"></span>
          <img src="assets/logo-shreeji-builders.jpg" alt="Shreeji Builders">
        </div>
      </div>
    </aside>
    <main id="main" class="main"></main>
  </div>

  <dialog id="modal" class="modal"></dialog>
  <div id="print-area"></div>

  <script src="js/i18n.js"></script>
  <script src="js/brand.js"></script>
  <script src="js/store.js"></script>
  <script src="js/calc.js"></script>
  <script src="js/entities.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/changes.js"></script>
  <script src="js/materials.js"></script>
  <script src="js/daily.js"></script>
  <script src="js/complaints.js"></script>
</body>
</html>
